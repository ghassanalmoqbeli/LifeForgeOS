name: build-release

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

jobs:
  android-apk:
    name: Build Android APK (debug + release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Ensure required Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Assemble release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LifeForge-APK
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

  windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Windows distributable (EXE)
        run: .\gradlew.bat :windowsApp:createDistributable --no-daemon

      - name: Verify EXE output
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "windowsApp\build\compose\binaries\main" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
          if ($exe) { $exe.FullName } else { Write-Error "No EXE found under windowsApp/build/compose/binaries/main" }

      - uses: actions/upload-artifact@v4
        with:
          name: LifeForge-Windows
          path: windowsApp/build/compose/binaries/main/
          if-no-files-found: error